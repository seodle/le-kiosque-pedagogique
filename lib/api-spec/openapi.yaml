openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Le Kiosque Pédagogique API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: tickets
  - name: messages
  - name: intervener
  - name: dashboard
  - name: reference
  - name: admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ─────────────────────────────────────────────────────────────────
  /auth/staff-login:
    post:
      operationId: staffLogin
      tags: [auth]
      summary: Login for staff users (F2, F3, RD, PG, direction, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  # ── TICKETS ──────────────────────────────────────────────────────────────
  /tickets/create:
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a new anonymous ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Ticket created with credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCreated"

  /tickets/login:
    post:
      operationId: loginTicket
      tags: [tickets]
      summary: Authenticate as an anonymous teacher using ticket number + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCredentials"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid ticket credentials

  /tickets/me:
    get:
      operationId: getMyTicket
      tags: [tickets]
      summary: Get the authenticated teacher's ticket
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "401":
          description: Unauthorized

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get a ticket by ID (staff only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /tickets/{id}/claim:
    patch:
      operationId: claimTicket
      tags: [tickets]
      summary: Claim a ticket (N1 or N2)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "409":
          description: Already claimed

  /tickets/{id}/escalate:
    patch:
      operationId: escalateTicket
      tags: [tickets]
      summary: Escalate a ticket to N2 (N1 only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket escalated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"

  /tickets/{id}/resolve-n1:
    patch:
      operationId: resolveTicketN1
      tags: [tickets]
      summary: Resolve a ticket at level 1 (N1 only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"

  /tickets/{id}/resolve:
    patch:
      operationId: resolveTicket
      tags: [tickets]
      summary: Resolve a ticket at level 2 (N2 only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"

  /tickets/{id}/webex:
    patch:
      operationId: closeTicketWebex
      tags: [tickets]
      summary: Schedule a collective visio session (F3 only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebexInput"
      responses:
        "200":
          description: Ticket closed with Webex
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"

  /tickets/{id}/reassign-n1:
    patch:
      operationId: reassignTicketN1
      tags: [tickets]
      summary: Reassign a ticket to another F2 (current assignee only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignInput"
      responses:
        "200":
          description: Ticket reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "409":
          description: Cannot reassign in current state

  /tickets/{id}/reassign-n2:
    patch:
      operationId: reassignTicketN2
      tags: [tickets]
      summary: Reassign a ticket to another F3 (current assignee only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignInput"
      responses:
        "200":
          description: Ticket reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "409":
          description: Cannot reassign in current state

  # ── MESSAGES ─────────────────────────────────────────────────────────────
  /messages:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a ticket conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/ticket/{ticketId}:
    get:
      operationId: getTicketMessages
      tags: [messages]
      summary: Get all messages for a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "403":
          description: Forbidden

  # ── INTERVENER POOL ───────────────────────────────────────────────────────
  /intervener/pool:
    get:
      operationId: getPool
      tags: [intervener]
      summary: Get the ticket pool for the current intervener (N1 or N2)
      responses:
        "200":
          description: Tickets in pool
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketSummary"
        "403":
          description: Forbidden

  /intervener/my-tickets:
    get:
      operationId: getMyAssignedTickets
      tags: [intervener]
      summary: Get tickets assigned to the current intervener
      parameters:
        - name: resolved
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns resolved/closed tickets instead of in-progress ones
      responses:
        "200":
          description: Assigned tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketSummary"

  /intervener/colleagues:
    get:
      operationId: listIntervenerColleagues
      tags: [intervener]
      summary: List colleagues available for reassignment (same role)
      responses:
        "200":
          description: Colleagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Colleague"

  # ── DASHBOARDS ────────────────────────────────────────────────────────────
  /dashboard/rd:
    get:
      operationId: getDashboardRd
      tags: [dashboard]
      summary: Get RD dashboard stats
      parameters:
        - name: disciplineId
          in: query
          required: false
          schema:
            type: integer
          description: Filtre par discipline (admin uniquement)
        - name: schoolId
          in: query
          required: false
          schema:
            type: integer
          description: Filtre par établissement (admin uniquement)
      responses:
        "200":
          description: RD dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RdDashboard"
        "403":
          description: Forbidden

  /dashboard/rd/tickets:
    get:
      operationId: listRdTickets
      tags: [dashboard]
      summary: List tickets in RD scope (read-only, descriptions included)
      parameters:
        - name: disciplineId
          in: query
          required: false
          schema:
            type: integer
          description: Filtre par discipline (admin uniquement)
        - name: schoolId
          in: query
          required: false
          schema:
            type: integer
          description: Filtre par établissement (admin uniquement)
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tickets in scope
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketSummary"
        "403":
          description: Forbidden

  /dashboard/pg:
    get:
      operationId: getDashboardPg
      tags: [dashboard]
      summary: Get PG dashboard stats (scoped to account discipline)
      parameters:
        - name: disciplineId
          in: query
          required: false
          schema:
            type: integer
          description: Filtre par discipline (admin uniquement)
        - name: schoolId
          in: query
          required: false
          schema:
            type: integer
          description: Filtre par établissement (admin uniquement)
      responses:
        "200":
          description: PG dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PgDashboard"
        "403":
          description: Forbidden

  # ── REFERENCE DATA ────────────────────────────────────────────────────────
  /schools:
    get:
      operationId: listSchools
      tags: [reference]
      summary: List all active schools
      responses:
        "200":
          description: Schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"

  /disciplines:
    get:
      operationId: listDisciplines
      tags: [reference]
      summary: List all active disciplines
      responses:
        "200":
          description: Disciplines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discipline"

  # ── ADMIN ─────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a new staff user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already taken
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a staff user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deleted
        "400":
          description: Cannot delete own account

  /admin/schools:
    post:
      operationId: createSchool
      tags: [admin]
      summary: Create a school (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolInput"
      responses:
        "201":
          description: School created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"

  /admin/disciplines:
    post:
      operationId: createDiscipline
      tags: [admin]
      summary: Create a discipline (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisciplineInput"
      responses:
        "201":
          description: Discipline created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discipline"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── AUTH ─────────────────────────────────────────────────────────────
    StaffCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string

    AuthResult:
      type: object
      required: [token]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        schoolId:
          type: ["integer", "null"]
        disciplineId:
          type: ["integer", "null"]
        active:
          type: boolean
        school:
          $ref: "#/components/schemas/School"
        discipline:
          $ref: "#/components/schemas/Discipline"

    UserInput:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string
        role:
          type: string
        schoolId:
          type: ["integer", "null"]
        disciplineId:
          type: ["integer", "null"]

    UserUpdate:
      type: object
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string
        role:
          type: string
        schoolId:
          type: ["integer", "null"]
        disciplineId:
          type: ["integer", "null"]
        active:
          type: boolean

    # ── TICKETS ──────────────────────────────────────────────────────────
    TicketInput:
      type: object
      required: [schoolId, disciplineId, description]
      properties:
        schoolId:
          type: integer
        disciplineId:
          type: integer
        description:
          type: string

    TicketCredentials:
      type: object
      required: [ticketNumber, password]
      properties:
        ticketNumber:
          type: integer
        password:
          type: string

    TicketCreated:
      type: object
      required: [ticketNumber, password, token]
      properties:
        ticketNumber:
          type: integer
        password:
          type: string
        token:
          type: string

    TicketSummary:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: integer
        status:
          type: string
        description:
          type: ["string", "null"]
        schoolId:
          type: integer
        disciplineId:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        school:
          $ref: "#/components/schemas/School"
        discipline:
          $ref: "#/components/schemas/Discipline"

    TicketDetail:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: integer
        status:
          type: string
        schoolId:
          type: integer
        disciplineId:
          type: integer
        description:
          type: ["string", "null"]
        webexLink:
          type: ["string", "null"]
        webexScheduledAt:
          type: ["string", "null"]
          format: date-time
        webexCreatedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        school:
          $ref: "#/components/schemas/School"
        discipline:
          $ref: "#/components/schemas/Discipline"
        assignedN1Id:
          type: ["integer", "null"]
          description: Visible par le staff uniquement
        assignedN2Id:
          type: ["integer", "null"]
          description: Visible par le staff uniquement

    Colleague:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string

    ReassignInput:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: integer

    WebexInput:
      type: object
      required: [webexLink, scheduledAt]
      properties:
        webexLink:
          type: string
        scheduledAt:
          type: string
          format: date-time
          description: Date et heure de la session visio

    # ── MESSAGES ─────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, ticketId, content, messageType, createdAt]
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        senderId:
          type: ["integer", "null"]
        senderType:
          type: string
        content:
          type: string
        messageType:
          type: string
        createdAt:
          type: string

    MessageInput:
      type: object
      required: [ticketId, content]
      properties:
        ticketId:
          type: integer
        content:
          type: string

    # ── DASHBOARD ─────────────────────────────────────────────────────────
    RdDashboard:
      type: object
      required: [totalTickets, avgPickupMinutes, resolutionByLevel]
      properties:
        totalTickets:
          type: integer
        schoolId:
          type: ["integer", "null"]
        disciplineId:
          type: ["integer", "null"]
        disciplineName:
          type: ["string", "null"]
        schoolName:
          type: ["string", "null"]
        openTickets:
          type: integer
        avgPickupMinutes:
          type: ["number", "null"]
        resolutionByLevel:
          $ref: "#/components/schemas/ResolutionStats"
        ticketsByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        disciplineRankings:
          type: array
          description: Statistiques par discipline (vue direction, périmètre établissement)
          items:
            $ref: "#/components/schemas/DisciplineRanking"

    PgDashboard:
      type: object
      required: [totalTickets, monthlyTrend, schoolRankings, disciplineRankings]
      properties:
        totalTickets:
          type: integer
        schoolId:
          type: ["integer", "null"]
        schoolName:
          type: ["string", "null"]
        disciplineId:
          type: ["integer", "null"]
        disciplineName:
          type: ["string", "null"]
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyCount"
        schoolRankings:
          type: array
          items:
            $ref: "#/components/schemas/SchoolRanking"
        disciplineRankings:
          type: array
          items:
            $ref: "#/components/schemas/DisciplineRanking"

    ResolutionStats:
      type: object
      properties:
        f2:
          type: integer
        f3:
          type: integer
        webex:
          type: integer

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    MonthlyCount:
      type: object
      required: [month, count]
      properties:
        month:
          type: string
        count:
          type: integer

    SchoolRanking:
      type: object
      required: [schoolId, schoolName, totalTickets, escalationRate, resolutionRate, avgMinutes]
      properties:
        schoolId:
          type: integer
        schoolName:
          type: string
        totalTickets:
          type: integer
        escalationRate:
          type: number
          description: Percentage 0–100 of tickets remontés vers F3
        resolutionRate:
          type: number
          description: Percentage 0–100 of tickets résolus (F2, F3 ou Webex)
        avgMinutes:
          type: ["number", "null"]

    DisciplineRanking:
      type: object
      required: [disciplineId, disciplineName, totalTickets, escalationRate, resolutionRate, avgMinutes]
      properties:
        disciplineId:
          type: integer
        disciplineName:
          type: string
        totalTickets:
          type: integer
        escalationRate:
          type: number
          description: Percentage 0–100 of tickets remontés vers F3
        resolutionRate:
          type: number
          description: Percentage 0–100 of tickets résolus (F2, F3 ou Webex)
        avgMinutes:
          type: ["number", "null"]

    # ── REFERENCE ─────────────────────────────────────────────────────────
    School:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: ["string", "null"]
        active:
          type: boolean

    SchoolInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        city:
          type: string

    Discipline:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        active:
          type: boolean

    DisciplineInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
